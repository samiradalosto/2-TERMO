<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FactoryConnect - Portal de Gestão Industrial</title>
    <!-- Link para acesso Bootstrap 5.3.9 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <!-- Link para o seu ficheiro CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <main class="container-fluid px-4 px-md-5 py-4">
        
        <div class="painel-industrial p-4 p-md-5 text-white shadow">
            
            <header class="mb-4">
                <h1 class="h3 fw-bold mb-3">FactoryConnect - Portal de Gestão Industrial</h1>
                <p class="text-white-50 mb-0">
                    Uma indústria está digitalizando seus processos e contratou a DevSolutions para criar uma interface Web responsiva que centralize informações das principais áreas.
                </p>
            </header>

            <section class="row g-4 mt-2">
                
                <!-- Área 1: Produção -->
                <article class="col-12 col-md-6 col-lg-4">
                    <div class="card-area p-2 text-center">
                        <a href="#producao" class="btn btn-area text-white px-4 py-2">Produção</a>
                    </div>
                </article>

                <!-- Área 2: Manutenção -->
                <article class="col-12 col-md-6 col-lg-4">
                    <div class="card-area p-2 text-center">
                        <a href="#manutencao" class="btn btn-area text-white px-4 py-2">Manutenção</a>
                    </div>
                </article>

                <!-- Área 3: Qualidade -->
                <article class="col-12 col-md-6 col-lg-4">
                    <div class="card-area p-2 text-center">
                        <a href="#qualidade" class="btn btn-area text-white px-4 py-2">Qualidade</a>
                    </div>
                </article>

                <!-- Área 4: Logística -->
                <article class="col-12 col-md-6 col-lg-4">
                    <div class="card-area p-2 text-center">
                        <a href="#logistica" class="btn btn-area text-white px-4 py-2">Logística</a>
                    </div>
                </article>

                <!-- Área 5: Segurança -->
                <article class="col-12 col-md-6 col-lg-4">
                    <div class="card-area p-2 text-center">
                        <a href="#seguranca" class="btn btn-area text-white px-4 py-2">Segurança</a>
                    </div>
                </article>

                <!-- Área 6: Tecnologia -->
                <article class="col-12 col-md-6 col-lg-4">
                    <div class="card-area p-2 text-center">
                        <a href="#tecnologia" class="btn btn-area text-white px-4 py-2">Tecnologia</a>
                    </div>
                </article>

            </section>

        </div>

    </main>

</body>
</html>
